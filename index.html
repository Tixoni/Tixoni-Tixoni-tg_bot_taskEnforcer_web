<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="api-base" content="https://tgbottaskenforcer-production.up.railway.app">
    <title>Task Enforcer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="pb-24">
    <div id="init-error" class="hidden fixed top-4 left-4 right-4 z-50 p-4 rounded-xl bg-red-900 text-white border border-red-700 text-xs"></div>

    <main id="screen-today" class="p-4 space-y-6">
        <h1 class="text-3xl font-bold text-white mb-2">Сегодня</h1>
        
        <section>
            <h2 class="section-title">Задачи</h2>
            <div class="section-block">
                <div id="list-active-tasks" class="list-section"></div>
            </div>
        </section>

        <div class="fixed bottom-24 left-4 right-4 flex gap-2">
            <input type="text" id="task-input" placeholder="Новая задача..." 
                   class="flex-1 p-4 bg-[#252525] text-white rounded-2xl border border-zinc-800 outline-none placeholder:text-zinc-600 shadow-xl">
            <button id="btn-add-task" class="bg-blue-600 text-white w-14 rounded-2xl flex items-center justify-center shadow-lg active:scale-95 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
            </button>
        </div>
    </main>

    <main id="screen-habits" class="p-4 hidden space-y-6">
        <h1 class="text-3xl font-bold text-white mb-2">Привычки</h1>
        
        <div class="section-block">
            <div id="list-habits-only" class="list-section"></div>
        </div>

        <div class="fixed bottom-24 left-4 right-4 flex gap-2">
            <input type="text" id="habit-input" placeholder="Новая привычка..." 
                   class="flex-1 p-4 bg-[#252525] text-white rounded-2xl border border-zinc-800 outline-none placeholder:text-zinc-600 shadow-xl">
            <button id="btn-add-habit" class="bg-orange-500 text-white w-14 rounded-2xl flex items-center justify-center shadow-lg active:scale-95 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
            </button>
        </div>
    </main>

    <main id="screen-calendar" class="p-4 hidden space-y-6">
        <div class="flex items-center justify-between mb-4">
            <h1 class="text-3xl font-bold text-white">Календарь</h1>
            <div class="flex gap-2">
                 <button id="btn-prev-month" class="p-2 bg-[#252525] rounded-lg text-white">←</button>
                <button id="btn-next-month" class="p-2 bg-[#252525] rounded-lg text-white">→</button>
            </div>
        </div>
        
        <div id="calendar-grid" class="grid grid-cols-7 gap-1 mb-6"></div>
        
        <h2 id="selected-date-title" class="section-title">Задачи на выбранный день</h2>
        <div class="section-block">
            <div id="list-calendar-tasks" class="list-section"></div>
        </div>
    </main>

    <div id="context-modal" class="modal-backdrop hidden">
        <div class="modal-content">
            <h3 id="modal-title" class="text-center text-gray-400 text-sm mb-4">Выберите действие</h3>
            <div class="space-y-2">
                <button id="btn-modal-edit" class="w-full py-4 bg-[#252525] text-white rounded-2xl font-medium active:bg-[#333] transition flex items-center justify-center gap-2">
                    ✏️ Редактировать
                </button>
                <button id="btn-modal-delete" class="w-full py-4 bg-[#3f1818] text-red-400 rounded-2xl font-medium active:bg-[#4a1c1c] transition flex items-center justify-center gap-2">
                    🗑 Удалить
                </button>
                <button id="btn-modal-cancel" class="w-full py-4 text-gray-400 font-medium">Отмена</button>
            </div>
        </div>
    </div>

    <div id="edit-modal" class="modal-backdrop hidden">
        <div class="modal-content">
            <h2 class="font-bold text-xl text-white mb-4">Редактировать</h2>
            <input type="text" id="edit-input" class="w-full p-4 bg-[#252525] rounded-2xl border-none outline-none text-white text-lg">
            <button id="btn-save-edit" class="w-full mt-6 py-4 bg-orange-500 text-white font-bold rounded-2xl active:scale-95 transition">
                Сохранить
            </button>
        </div>
    </div>

    <nav class="nav-bar">
        <button id="btn-today" class="nav-btn active">
            <span class="text-[10px] uppercase tracking-widest font-bold">Сегодня</span>
        </button>
        <button id="btn-habits" class="nav-btn">
            <span class="text-[10px] uppercase tracking-widest font-bold">Привычка</span>
        </button>
        <button id="btn-calendar" class="nav-btn">
            <span class="text-[10px] uppercase tracking-widest font-bold">Календарь</span>
        </button>
    </nav>

    <script src="script.js"></script>
</body>
</html>
